<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>The Munsell Color Space</title>
        <link rel="icon" href="/favicon.ico" type="image/x-icon">
		<style>
			body { 
                margin: 0;
                background-color: #282c34; /* Set a background color */
            }
            #info {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                z-index: 100;
                padding: 14px 16px;
                text-align: center;
                color: #ffffff;
                font-size: 16px;
                line-height: 1.3;
                font-family: system-ui, sans-serif;
                text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
                pointer-events: none;
            }
            #loading-screen {
                position: fixed;
                width: 100%;
                height: 100%;
                background-color: #282c34; /* Match the background color */
                color: white;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 2em;
                z-index: 9999;
            }
    
		</style>
	</head>
	<body>
        <div id="info">Drag mouse to view the Munsell color space</div>
        <script type="module" src="/src/config.js"></script>
        <script type="module">
            import { BACKGROUND_COLOR } from './src/config.js';
            document.body.style.backgroundColor = BACKGROUND_COLOR;
        </script>
        <script type="module" src="/src/main.js"></script>
        </body>
</html>
